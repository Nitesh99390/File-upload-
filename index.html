<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gofile Clone - File Share</title>
    
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; margin: 0; padding: 20px; 
            background-color: #f4f4f9; 
            display: flex; justify-content: center; align-items: center; height: 100vh; 
        }
        .container { 
            background: white; padding: 30px; border-radius: 12px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); width: 100%; max-width: 400px; 
        }
        h2 { color: #333; margin-bottom: 20px; }
        input[type="file"] { 
            margin: 15px 0; padding: 10px; width: 90%; 
            border: 1px solid #ccc; border-radius: 6px; 
        }
        button { 
            background-color: #007bff; color: white; border: none; 
            padding: 12px 20px; border-radius: 6px; cursor: pointer; 
            font-size: 16px; width: 100%; transition: 0.3s; 
        }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 15px; font-weight: bold; color: #28a745; }
        #linkContainer { 
            margin-top: 20px; word-wrap: break-word; background: #e9ecef; 
            padding: 10px; border-radius: 6px; display: none; 
        }
        #linkContainer a { color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Upload & Share Files</h2>
        <input type="file" id="fileInput">
        <button id="uploadBtn">Upload File</button>
        
        <p id="status"></p>
        <div id="linkContainer"></div>
    </div>

    <!-- PWA Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log("Service Worker Registered"))
            .catch(err => console.log("Service Worker Failed", err));
        }
    </script>
    
    <!-- Firebase Logic File -->
    <script type="module" src="app.js"></script>

</body>
</html>
